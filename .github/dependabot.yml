# Dependabot keeps Go modules and GitHub Actions up to date.
# Weekly cadence is calm enough not to be noise; security advisories
# still create immediate PRs regardless of schedule.
#
# Dependabot does not touch the `toolchain` directive in go.mod, and
# actions/setup-go reads that directive via go-version-file. A stale pin holds
# every job on an old Go patch, and the first symptom is govulncheck failing on
# standard-library CVEs no dependency bump can fix. Bump it by hand.
#
# Both ecosystems are grouped into a single PR each. Ungrouped, one weekly run
# opened five PRs here, and five PRs that each need a full CI pass to merge is
# the backlog this repo actually had.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
